name: release
on:
  push:
    branches: ['release/**']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the tag
        id: tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.Substring('release/'.Length)
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[A-Za-z0-9.]+)?$') { throw "Branch name must be release/vX.Y.Z[-suffix], got $tag" }
          $version = $tag.Substring(1)
          $source = Get-Content app\src\UI.cs -Raw
          if ($source -notmatch ('Version = "' + [regex]::Escape($version) + '"')) { throw "UI.Version in app\src\UI.cs does not match $version" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($tag.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Build with .NET Framework csc
        shell: cmd
        run: cd app && build.cmd
      - name: Self-test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app\out\logs | Out-Null
          app\tests\ci\invoke-exe.ps1 -Exe app\out\PSTools.exe -Arguments '--selftest','--quiet' -Log app\out\logs\selftest.txt
          exit $LASTEXITCODE
      - name: Package
        shell: pwsh
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $stage = "dist\PSTools-$tag"
          New-Item -ItemType Directory -Force $stage | Out-Null
          foreach ($f in 'PSTools.exe', 'actions.json', 'cheatsheet.json', 'commands.json') { Copy-Item "app\out\$f" $stage }
          Copy-Item README.md $stage
          $notes = "docs\v4\RELEASE_NOTES_$('${{ steps.tag.outputs.version }}').md"
          if (Test-Path $notes) { Copy-Item $notes (Join-Path $stage 'RELEASE_NOTES.md') }
          $zip = "dist\PSTools-$tag.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText('dist\SHA256.txt', "$hash  PSTools-$tag.zip`n")
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: PSTools-${{ steps.tag.outputs.tag }}
          path: |
            dist/*.zip
            dist/SHA256.txt
      - name: Draft release
        shell: pwsh
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $existing = gh release view $tag --json isDraft 2>$null | ConvertFrom-Json
          if ($existing) {
            if ($existing.isDraft) { gh release delete $tag --yes | Out-Null }
            else { throw "Release $tag is already published. Use a new branch name." }
          }
          $notes = "docs\v4\RELEASE_NOTES_$('${{ steps.tag.outputs.version }}').md"
          $args = @('release', 'create', $tag, "dist\PSTools-$tag.zip", 'dist\SHA256.txt', '--draft', '--target', $env:GITHUB_SHA, '--title', "PS Tools $tag")
          if ('${{ steps.tag.outputs.prerelease }}' -eq 'true') { $args += '--prerelease' }
          if (Test-Path $notes) { $args += @('--notes-file', $notes) } else { $args += @('--notes', "PS Tools $tag") }
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
      - name: Copy the zip to the ui-gallery branch
        shell: bash
        run: |
          tag='${{ steps.tag.outputs.tag }}'
          work="$(mktemp -d)"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --quiet --depth 1 --branch ui-gallery "$remote" "$work/g" 2>/dev/null; then :; else
            mkdir -p "$work/g"; git -C "$work/g" init -q; git -C "$work/g" checkout -q --orphan ui-gallery; git -C "$work/g" remote add origin "$remote"
          fi
          git -C "$work/g" config user.name "ps-tools-ci"
          git -C "$work/g" config user.email "ci@users.noreply.github.com"
          mkdir -p "$work/g/release-assets/$tag"
          cp dist/PSTools-$tag.zip dist/SHA256.txt "$work/g/release-assets/$tag/"
          git -C "$work/g" add -A
          git -C "$work/g" commit -q -m "release assets $tag $GITHUB_SHA" || true
          git -C "$work/g" push -q origin ui-gallery
